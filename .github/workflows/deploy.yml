# 每日更新净值/估值并部署到 GitHub Pages
# 设计要点：
#   · 触发：每日 23:30 北京时间(UTC+8) 定时 + 手动 workflow_dispatch + push
#   · 数据全免 key：行情走东财/天天基金/腾讯/新浪/雅虎/ECB，估值走蛋卷 + 中证官网PE自算
#   · 增量更新：data/history 入仓，每次只拉增量并合并；财务缓存走 actions/cache 持久化
#   · 抓取失败不致命：保留上一次入仓的 JSON（页面照常显示，只是当日不刷新）
#   · 用 GITHUB_TOKEN 推送会自动带 [skip ci]，不会触发二次 workflow
name: 每日更新并部署

on:
  schedule:
    - cron: '30 15 * * *'      # 15:30 UTC = 23:30 北京时间
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 持久化财务缓存（A500 自算 ROE 用）
        uses: actions/cache@v4
        with:
          path: |
            data/valuation/_a500_fin.json
            data/valuation/_calib_fin.json
          key: fin-${{ github.run_id }}
          restore-keys: |
            fin-

      - name: 更新行情净值
        run: python scripts/update_data.py

      - name: 更新估值（蛋卷 + 中证A500 自算）
        run: python scripts/fetch_valuation.py

      - name: 打包 valuation.js
        run: python scripts/build_valuation_js.py

      - name: 准备 Pages 产物（明文，加密延后到 deploy 作业）
        run: |
          rm -rf public && mkdir -p public
          # 站点根目录：index.html + assets(自包含行情/估值数据) + data(历史JSON兜底)
          cp index.html public/
          cp -r assets public/
          cp -r data public/
          touch public/.nojekyll

      - name: 上传待加密站点产物
        uses: actions/upload-artifact@v4
        with:
          name: site-raw
          path: public

      # 数据落库（增量入仓，供下次运行合并）。放在最后且 best-effort：
      # 即便 git 推送因历史分叉/网络抖动失败，也不应阻断上面的加密部署。
      - name: 提交更新（best-effort，失败不阻断加密部署）
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "自动更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') [skip ci]"
            git pull --rebase origin master
            git push
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout（取加密脚本）
        uses: actions/checkout@v4

      - name: 下载待加密站点产物
        uses: actions/download-artifact@v4
        with:
          name: site-raw
          path: public

      - name: 设置 Node.js（加密脚本用）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查口令密钥是否注入（仅显示是否/长度，绝不显示内容）
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -n "$SITE_PASSWORD" ]; then
            echo "SITE_PASSWORD 已注入（长度 ${#SITE_PASSWORD}）"
          else
            echo "SITE_PASSWORD 未注入：请到 仓库 Settings → Secrets and variables → Actions → New repository secret，Name 必须一字不差为 SITE_PASSWORD"
          fi

      - name: 加密敏感数据（缺 SITE_PASSWORD 则报错，拒绝明文部署）
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: node tools/encrypt_site.mjs public

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
