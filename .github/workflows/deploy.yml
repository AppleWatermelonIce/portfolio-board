# 每日更新净值/估值并部署到 GitHub Pages
# 设计要点：
#   · 触发：每日 23:30 北京时间(UTC+8) 定时 + 手动 workflow_dispatch + push
#   · 数据全免 key：行情走东财/天天基金/腾讯/新浪/雅虎/ECB，估值走蛋卷 + 中证官网PE自算
#   · 增量更新：data/history 入仓，每次只拉增量并合并；财务缓存走 actions/cache 持久化
#   · 抓取失败不致命：保留上一次入仓的 JSON（页面照常显示，只是当日不刷新）
#   · 用 GITHUB_TOKEN 推送会自动带 [skip ci]，不会触发二次 workflow
name: 每日更新并部署

on:
  schedule:
    - cron: '30 15 * * *'      # 15:30 UTC = 23:30 北京时间
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 持久化财务缓存（A500 自算 ROE 用）
        uses: actions/cache@v4
        with:
          path: |
            data/valuation/_a500_fin.json
            data/valuation/_calib_fin.json
          key: fin-${{ github.run_id }}
          restore-keys: |
            fin-

      - name: 更新行情净值
        # 部分标的抓取失败（典型：海外 runner 访问国内站点超时）时 update_data.py 返回 2，
        # 但脚本已沿用上一次入仓数据、产物仍然完整 —— 按本项目「抓取失败不致命」的既定口径，
        # 这不应当阻断后续的加密与部署。故此处容错，并把降级明细写成 annotation 便于远程诊断。
        continue-on-error: true
        run: |
          python scripts/update_data.py 2>&1 | tee /tmp/upd.log
          code=${PIPESTATUS[0]}     # 必须立刻保存：后续任何命令都会重置 PIPESTATUS
          grep -E '\[(降级|失败)\]' /tmp/upd.log | head -20 | while IFS= read -r line; do
            echo "::warning::UPD ${line}"
          done
          echo "::warning::UPD_EXIT ${code}"

      - name: 更新估值（蛋卷 + 中证A500 自算）
        run: python scripts/fetch_valuation.py

      - name: 打包 valuation.js
        run: python scripts/build_valuation_js.py

      - name: 准备 Pages 产物（明文，加密延后到 deploy 作业）
        run: |
          rm -rf public && mkdir -p public
          # 站点根目录：index.html + assets(自包含行情/估值数据) + data(历史JSON兜底)
          cp index.html public/
          cp -r assets public/
          cp -r data public/
          touch public/.nojekyll

      - name: 上传待加密站点产物
        uses: actions/upload-artifact@v4
        with:
          name: site-raw
          path: public

      # 数据落库（增量入仓，供下次运行合并）。放在最后且 best-effort：
      # 即便 git 推送因历史分叉/网络抖动失败，也不应阻断上面的加密部署。
      - name: 提交更新（best-effort，失败不阻断加密部署）
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "自动更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') [skip ci]"
            git pull --rebase origin master
            git push
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 口令候选来源（多名称兼容）：加密步骤按顺序取第一个非空者。
    # 首选 secrets.SITE_PASSWORD；其余为兼容兜底，用于兜住"仓库里实际用了别的名字"的情况。
    # 注意：vars.* 是明文变量，若命中会显式告警（不安全，应改用 Secret）。
    env:
      S_SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      S_APPLWATERMELONICE: ${{ secrets.APPLWATERMELONICE }}
      S_PASSWORD: ${{ secrets.PASSWORD }}
      S_SITE_PASS: ${{ secrets.SITE_PASS }}
      S_PASS: ${{ secrets.PASS }}
      S_PWD: ${{ secrets.PWD }}
      S_VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
      S_ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
      S_PASSWORD_SITE: ${{ secrets.PASSWORD_SITE }}
      S_BOARD_PASSWORD: ${{ secrets.BOARD_PASSWORD }}
      S_KEY: ${{ secrets.KEY }}
      S_SECRET: ${{ secrets.SECRET }}
      V_SITE_PASSWORD: ${{ vars.SITE_PASSWORD }}
      V_APPLWATERMELONICE: ${{ vars.APPLWATERMELONICE }}
      # 自检：GITHUB_TOKEN 是 Actions 内置且必然存在的密钥，其长度可证明 secrets 通道本身是否正常
      S_SELFTEST: ${{ secrets.GITHUB_TOKEN }}
      S_SELFTEST2: ${{ github.run_id }}
    steps:
      - name: Checkout（取加密脚本）
        uses: actions/checkout@v4

      - name: 下载待加密站点产物
        uses: actions/download-artifact@v4
        with:
          name: site-raw
          path: public

      - name: 设置 Node.js（加密脚本用）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 口令来源探测（仅报告命中的名字与长度，绝不显示内容）
        run: |
          hits=""
          add(){ if [ -n "$2" ]; then hits="$hits $1(len=${#2})"; fi; }
          add secrets.SITE_PASSWORD     "$S_SITE_PASSWORD"
          add secrets.APPLWATERMELONICE "$S_APPLWATERMELONICE"
          add secrets.PASSWORD          "$S_PASSWORD"
          add secrets.SITE_PASS         "$S_SITE_PASS"
          add secrets.PASS              "$S_PASS"
          add secrets.PWD               "$S_PWD"
          add secrets.VAULT_PASSWORD    "$S_VAULT_PASSWORD"
          add secrets.ACCESS_PASSWORD   "$S_ACCESS_PASSWORD"
          add secrets.PASSWORD_SITE     "$S_PASSWORD_SITE"
          add secrets.BOARD_PASSWORD    "$S_BOARD_PASSWORD"
          add secrets.KEY               "$S_KEY"
          add secrets.SECRET            "$S_SECRET"
          add vars.SITE_PASSWORD        "$V_SITE_PASSWORD"
          add vars.APPLWATERMELONICE    "$V_APPLWATERMELONICE"
          add D_selftest.GITHUB_TOKEN   "$S_SELFTEST"
          add D_selftest.RUNNER_OS_OK   "$S_SELFTEST2"
          echo "::warning::PWPROBE 命中:${hits:- NONE —— 本仓库 Actions 作用域下读不到任何口令}"
          echo "::warning::PWPROBE 自检说明：若上一条只命中 D_selftest.GITHUB_TOKEN，则说明密钥读取通道正常、只是仓库内确实没有名为上述候选的密钥。"

      - name: 加密敏感数据（缺口令则报错，拒绝明文部署）
        run: |
          PW=""; SRC=""
          for cand in S_SITE_PASSWORD S_APPLWATERMELONICE S_PASSWORD S_SITE_PASS S_PASS S_PWD S_VAULT_PASSWORD S_ACCESS_PASSWORD S_PASSWORD_SITE S_BOARD_PASSWORD S_KEY S_SECRET V_SITE_PASSWORD V_APPLWATERMELONICE; do
            eval "val=\$$cand"
            if [ -n "$val" ]; then PW="$val"; SRC="$cand"; break; fi
          done
          if [ -z "$PW" ]; then
            echo "::error::ENC_NOPASS 未能从任何候选密钥名读到口令 → 拒绝以明文部署"
            exit 1
          fi
          case "$SRC" in
            V_*) echo "::warning::ENCSRC 口令来自 Actions 变量（$SRC），明文公开不安全，请改为 Secret";;
          esac
          echo "::notice::ENCSRC 口令来源=$SRC 长度=${#PW}（内容不显示）"
          SITE_PASSWORD="$PW" node tools/encrypt_site.mjs public

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
